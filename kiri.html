<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Menu Navigasi</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Verdana, Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .menu-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #800080;
            box-shadow: 0 4px 8px rgba(128, 0, 128, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        .menu-title {
            background-color: #BDCED9;
            color: #800080;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            font-family: Tahoma, sans-serif;
            border-bottom: 2px solid #800080;
        }
        .menu-item {
            padding: 11px;
            border-top: 1px solid #e2d4ec;
            background-color: #faf9fb;
            transition: all 0.3s ease;
        }
        .menu-item:hover {
            background-color: #f1e3f5;
        }
        .menu-item a {
            color: #800080;
            text-decoration: none;
            font-weight: bold;
            font-family: Tahoma, sans-serif;
            font-size: 13px;
            display: block;
        }
        .menu-item a:hover {
            color: #3366cc;
            padding-left: 5px;
        }
    </style>
</head>
<body>
    <table class="menu-table" cellspacing="0">
        <tr>
            <td class="menu-title">&nbsp;&nbsp;📋 Menu Utama</td>
        </tr>
        <tr>
            <td class="menu-item">&nbsp;&nbsp;<a href="beranda.html" target="kanan">Beranda</a></td>
        </tr>
        <tr>
            <td class="menu-item">&nbsp;&nbsp;<a href="profil.html" target="kanan">Profil & Lokasi</a></td>
        </tr>
        <tr>
            <td class="menu-item">&nbsp;&nbsp;<a href="galeri.html" target="kanan">Galeri (Foto & Video)</a></td>
        </tr>
        <tr>
            <td class="menu-item">&nbsp;&nbsp;<a href="buku_tamu.html" target="kanan">Buku Tamu</a></td>
        </tr>
        <tr>
            <td class="menu-item">&nbsp;&nbsp;<a href="kelompok.html" target="kanan">Kelompok Kami</a></td>
        </tr>
    </table>
</body>
</html>
