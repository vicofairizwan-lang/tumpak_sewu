<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Tumpak Sewu</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Verdana, Arial, sans-serif;
            background: linear-gradient(135deg, #f8f0fa 0%, #e2d4ec 100%);
            color: #333333;
            overflow: hidden;
            border-bottom: 2px solid #800080;
        }
        .header {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px;
        }
        .isi-header { width: 100%; }
        .nama-sekolah {
            margin: 0;
            color: #800080;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .subjudul {
            margin-top: 6px;
            color: #3366cc;
            font-size: 13px;
            font-style: italic;
            font-weight: bold;
        }
        .slogan {
            margin-top: 6px;
            color: #800080;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1.2px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="isi-header">
            <h1 class="nama-sekolah">WISATA AIR TERJUN TUMPAK SEWU</h1>
            <div class="subjudul">Keindahan Pesona Niagara of Indonesia di Kabupaten Lumajang & Malang, Jawa Timur</div>
            <div class="slogan">✨ ALAM • SEJUK • EKSOTIK • MENAKJUBKAN ✨</div>
        </div>
    </div>
</body>
</html>
